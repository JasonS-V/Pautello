name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Formato, lint, typecheck, tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Debe ir antes de setup-node para que el cache de pnpm funcione.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Pasos separados a propósito: si algo falla, se ve de un vistazo qué falló.
      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

      # Con --coverage: el umbral de vite.config.ts es un gate real, no un
      # número decorativo que nadie evalúa.
      - name: Tests y cobertura (vitest)
        run: pnpm test:coverage

      - name: Inferencia OMR real con referencia pública
        run: >-
          pnpm omr:recognition
          --corpus src/omr/__tests__/fixtures/omr-corpus.json
          --sample pdmx-line-clean
          --variants baseline
          --greedy-only
          --gate
          --out "${{ runner.temp }}/omr-ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Robustez OMR por condición de imagen
        run: |
          pnpm omr:corpus --input src/omr/__tests__/fixtures/omr-corpus.json
          pnpm omr:recognition \
            --corpus src/omr/__tests__/fixtures/omr-corpus.json \
            --public-robustness \
            --variants baseline \
            --greedy-only \
            --robustness-gate \
            --out "${{ runner.temp }}/omr-robustness-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Guardar métricas OMR de la versión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omr-robustness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/omr-robustness-${{ github.run_id }}-${{ github.run_attempt }}/results.json
          if-no-files-found: ignore

      - name: Validar MusicXML 4.0 con XSD local
        run: |
          python -m pip install --disable-pip-version-check lxml==6.1.3
          pnpm exec vite-node scripts/omr-xml-fixture.ts --out "${{ runner.temp }}/omr-ci.musicxml"
          python -c "from lxml import etree; schema=etree.XMLSchema(etree.parse('scripts/musicxml-schema/musicxml.xsd')); schema.assertValid(etree.parse('${{ runner.temp }}/omr-ci.musicxml'))"

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Instalar Chromium para prueba OMR
        run: pnpm exec playwright install --with-deps chromium

      - name: Importación OMR real en navegador
        run: |
          pnpm preview --host 127.0.0.1 > "${{ runner.temp }}/pautello-preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/omr-ui-check.mjs \
            --input src/omr/__tests__/fixtures/line.png \
            --out "${{ runner.temp }}/omr-ui-${{ github.run_id }}-${{ github.run_attempt }}" \
            --url http://127.0.0.1:4173/ \
            --block-external \
            --assert-console-clean
